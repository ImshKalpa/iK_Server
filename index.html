<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, #3730a3, transparent 35%),
    radial-gradient(circle at bottom right, #4f46e5, transparent 30%),

  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

/* MAIN CARD */

.container {
  width: 400px;
  max-width: 92%;
  padding: 32px;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 25px;
  backdrop-filter: blur(20px);

  box-shadow: 0 25px 80px rgba(0,0,0,0.55);

  animation: cardAppear .6s ease;
}

@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* LOGO */

.logo {
  text-align: center;

  font-size: 60px;
  font-weight: 900;

  letter-spacing: -6px;

  margin-bottom: 3px;

  background: linear-gradient(135deg,#fff,#a5b4fc);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  text-align: center;

  color: #a7a7b5;

  margin-bottom: 27px;

  font-size: 14px;
}

/* TABS */

.tabs {
  display: flex;

  background: rgba(0,0,0,.25);

  padding: 5px;

  border-radius: 13px;

  margin-bottom: 25px;
}

.tabs button {
  width: 50%;

  border: none;

  padding: 12px;

  border-radius: 9px;

  background: transparent;

  color: #999;

  cursor: pointer;

  font-size: 15px;

  transition: .25s;
}

.tabs button:hover {
  color: white;
}

.tabs button.active {
  background: white;

  color: #111;

  box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

/* FORMS */

.form {
  display: none;
}

.form.show {
  display: block;
}

/* PROVIDER BUTTONS */

.provider {
  width: 100%;

  padding: 13px 16px;

  margin: 7px 0;

  border-radius: 12px;

  border: 1px solid rgba(255,255,255,.14);

  background: rgba(255,255,255,.07);

  color: white;

  cursor: pointer;

  font-size: 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 12px;

  transition: .25s;
}

.provider:hover {
  background: rgba(255,255,255,.14);

  transform: translateY(-2px);

  box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.provider:active {
  transform: scale(.98);
}

.provider-icon {
  width: 23px;
  height: 23px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.provider-icon svg {
  width: 23px;
  height: 23px;

  display: block;
}

/* INPUTS */

label {
  display: block;

  margin: 15px 0 7px;

  color: #d5d5dc;

  font-size: 13px;
}

input {
  width: 100%;

  padding: 14px;

  border-radius: 11px;

  border: 1px solid rgba(255,255,255,.14);

  background: rgba(0,0,0,.28);

  color: white;

  outline: none;

  font-size: 14px;

  transition: .2s;
}

input::placeholder {
  color: #777;
}

input:focus {
  border-color: #818cf8;

  box-shadow:
    0 0 0 3px rgba(99,102,241,.15);
}

/* LOGIN BUTTON */

.loginBtn {

  font-size: 16px;

  transition: .25s;
}

.loginBtn:hover {

}

/* NOTICE */

.demo {

  margin-top: 20px;

  color: #777;

  font-size: 11px;

  line-height: 1.5;
}


/* =========================================
   FAKE HACK SCREEN
========================================= */

#hackScreen {
  display: none;

  position: fixed;

  inset: 0;

  background: #000;

  z-index: 9999;

  overflow: hidden;
}

/* MATRIX CANVAS */

#matrixCanvas {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  opacity: .75;
}

.matrixOverlay {
  position: absolute;

  inset: 0;

  background:
    radial-gradient(
      circle,
      transparent 0%,
      rgba(0,0,0,.45) 65%,
      rgba(0,0,0,.9) 100%
    );
}

/* SCANLINES */

.scanlines {
  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 2px,
      transparent 5px
    );

  opacity: .35;
}

/* TERMINAL */

.terminal {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  width: 850px;

  max-width: 92%;

  max-height: 80vh;

  padding: 25px;

  background: rgba(0,0,0,.78);

  border:
    1px solid rgba(0,255,90,.35);

  border-radius: 14px;

  box-shadow:
    0 0 50px rgba(0,255,80,.12);

  overflow: hidden;
}

.terminalHeader {
  display: flex;

  align-items: center;

  gap: 8px;

  padding-bottom: 15px;

  border-bottom:
    1px solid rgba(0,255,90,.18);

  margin-bottom: 15px;
}

.dot {
  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: #20ff70;

  box-shadow:
    0 0 10px #20ff70;
}

.terminalTitle {
  margin-left: 8px;

  color: #20ff70;

  font-size: 12px;

  letter-spacing: 2px;
}

#terminalText {
  height: 330px;

  overflow: hidden;

  color: #20ff70;

  font-family: "Courier New", monospace;

  font-size: 13px;

  line-height: 1.55;

  text-shadow:
    0 0 7px rgba(0,255,90,.7);
}

.terminalLine {
  white-space: nowrap;
}


/* =========================================
   FAKE ALERT
========================================= */

.fakeAlert {
  display: none;

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  width: 600px;

  border-radius: 15px;

@keyframes alertAppear {
  from {
    opacity: 0;

    transform:

  }

  to {
    opacity: 1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

.alertIcon {
  font-size: 70px;

  margin-bottom: 10px;

  animation:
    alertPulse .55s infinite alternate;
}

@keyframes alertPulse {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.12);
  }
}

.alertTitle {
  color: #ff2222;

  font-size: 35px;

  font-weight: 900;

.alertSub {

body:after{right:-16vw;bottom:-10vh;background:#af52de;animation-delay:-7s}
@keyframes liquidFloat{to{transform:translate(5%,8%) scale(1.12)}}

/* Main glass card */
.container{
  position:relative!important;

  border:1px solid var(--line)!important;
  border-radius:36px!important;
  box-shadow:var(--shadow)!important;
  -webkit-backdrop-filter:blur(36px) saturate(185%);
  backdrop-filter:blur(36px) saturate(185%);
  overflow:hidden;
}
.container:before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
   linear-gradient(125deg,rgba(255,255,255,.38),transparent 30%,transparent 70%,rgba(255,255,255,.09));
}
.container:after{
  content:"";position:absolute;top:-100%;left:-35%;width:35%;height:280%;

  transform:rotate(18deg);animation:glassSheen 9s ease-in-out infinite;
}

}

  }

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>

<script>

/* =========================================
   TAB SWITCH
========================================= */

function showTab(tab, button) {

  document
    .querySelectorAll(".form")
    .forEach(function(form) {

      form.classList.remove("show");

    });


  document
    .getElementById(tab)
    .classList.add("show");


  document
    .querySelectorAll(".tabs button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  button.classList.add("active");
}


/* =========================================
   PROVIDER
========================================= */

let selectedProvider = "";


function chooseProvider(provider) {

  selectedProvider = provider;


  document
    .getElementById("signin")
    .classList.remove("show");


  document
    .getElementById("login")
    .classList.add("show");


  document
    .querySelectorAll(".tabs button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  document
    .querySelector(
      ".tabs button:nth-child(2)"
    )
    .classList.add("active");

}

    Math.floor(
      canvas.width / fontSize
    );


  const drops =
    new Array(columns).fill(1);


  function drawMatrix() {

    ctx.fillStyle =
      "rgba(0,0,0,0.08)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#20ff70";


    ctx.font =
      fontSize + "px monospace";


    for (
      let i = 0;
      i < drops.length;
      i++
    ) {

      const char =
        characters[
          Math.floor(
            Math.random() *
            characters.length
          )
        ];


      ctx.fillText(
        char,
        i * fontSize,
        drops[i] * fontSize
      );


      if (
        drops[i] * fontSize >
        canvas.height &&
        Math.random() > .975
      ) {

        drops[i] = 0;

      }


      drops[i]++;

    }

  }


  setInterval(
    drawMatrix,
    45
  );

}


/* =========================================
   TERMINAL ANIMATION
========================================= */

function startTerminal() {

  const terminal =
    document.getElementById(
      "terminalText"
    );


  const messages = [

    "Initializing security protocol...",
    "Scanning system processes...",
    "Checking active connections...",
    "Analyzing network activity...",
    "Access verification started...",
    "Checking system permissions...",
    "Analyzing device services...",
    "Scanning security modules...",
    "WARNING: Unusual activity detected",
    "Attempting security lockdown...",
    "Analyzing system files...",
    "Checking active sessions...",
    "Security response initiated...",
    "System scan in progress...",
    "WARNING: Security status changed",
    "Finalizing security analysis..."

  ];


  let index = 0;


  const interval =
    setInterval(function() {


      const line =
        document.createElement(
          "div"
        );


      line.className =
        "terminalLine";


      const randomHex =
        Math.random()
        .toString(16)
        .substring(2,10)
        .toUpperCase();


      line.innerText =
        "[SYSTEM] " +
        messages[index] +
        " 0x" +
        randomHex;


      terminal.appendChild(
        line
      );


      if (
        terminal.children.length > 17
      ) {

        terminal.removeChild(
          terminal.firstChild
        );

      }


      index++;


      if (
        index >= messages.length
      ) {

        index = 0;

      }

    }, 170);


  setTimeout(function() {

    clearInterval(interval);

    showFakeAlert();

  }, 5200);

}


/* =========================================
   FINAL FAKE ALERT
========================================= */

function showFakeAlert() {

  document
    .getElementById("terminal")
    .style.display = "none";


  const alert =
    document.getElementById(
      "fakeAlert"
    );


  alert.style.display =
    "block";


  setTimeout(function() {

    document
      .getElementById(
        "prankReveal"
      )
      .style.display = "block";

  }, 2800);

}


/* =========================================
   WINDOW RESIZE
========================================= */

window.addEventListener(
  "resize",
  function() {

    const canvas =
      document.getElementById(
        "matrixCanvas"
      );


    if (canvas) {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }

  }
);

</script>


<script>
(() => {
  const root=document.documentElement;
  const btn=document.getElementById('liquidTheme');
  const icon=document.getElementById('liquidThemeIcon');
  const label=document.getElementById('liquidThemeLabel');
  let theme=localStorage.getItem('ik-secure-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

  function applyTheme(t,save=true){
    theme=t;
    root.dataset.theme=t;
    if(save) localStorage.setItem('ik-secure-theme',t);
    icon.textContent=t==='dark'?'🌙':'☀️';
    label.textContent=t==='dark'?'Dark':'Light';
  }
  applyTheme(theme,false);
  btn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
})();
</script>
