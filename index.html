<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://imshkalpa.github.io/iK_Server/ik-favicon-round.png">
  
<title>iK Secure Access</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, #3730a3, transparent 35%),
    radial-gradient(circle at bottom right, #4f46e5, transparent 30%),
    #09090f;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

/* MAIN CARD */

.container {
  width: 400px;
  max-width: 92%;
  padding: 32px;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 25px;
  backdrop-filter: blur(20px);

  box-shadow: 0 25px 80px rgba(0,0,0,0.55);

  animation: cardAppear .6s ease;
}

@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* LOGO */

.logo {
  text-align: center;

  font-size: 60px;
  font-weight: 900;

  letter-spacing: -6px;

  margin-bottom: 3px;

  background: linear-gradient(135deg,#fff,#a5b4fc);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  text-align: center;

  color: #a7a7b5;

  margin-bottom: 27px;

  font-size: 14px;
}

/* TABS */

.tabs {
  display: flex;

  background: rgba(0,0,0,.25);

  padding: 5px;

  border-radius: 13px;

  margin-bottom: 25px;
}

.tabs button {
  width: 50%;

  border: none;

  padding: 12px;

  border-radius: 9px;

  background: transparent;

  color: #999;

  cursor: pointer;

  font-size: 15px;

  transition: .25s;
}

.tabs button:hover {
  color: white;
}

.tabs button.active {
  background: white;

  color: #111;

  box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

/* FORMS */

.form {
  display: none;
}

.form.show {
  display: block;
}

/* PROVIDER BUTTONS */

.provider {
  width: 100%;

  padding: 13px 16px;

  margin: 7px 0;

  border-radius: 12px;

  border: 1px solid rgba(255,255,255,.14);

  background: rgba(255,255,255,.07);

  color: white;

  cursor: pointer;

  font-size: 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 12px;

  transition: .25s;
}

.provider:hover {
  background: rgba(255,255,255,.14);

  transform: translateY(-2px);

  box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.provider:active {
  transform: scale(.98);
}

.provider-icon {
  width: 23px;
  height: 23px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.provider-icon svg {
  width: 23px;
  height: 23px;

  display: block;
}

/* INPUTS */

label {
  display: block;

  margin: 15px 0 7px;

  color: #d5d5dc;

  font-size: 13px;
}

input {
  width: 100%;

  padding: 14px;

  border-radius: 11px;

  border: 1px solid rgba(255,255,255,.14);

  background: rgba(0,0,0,.28);

  color: white;

  outline: none;

  font-size: 14px;

  transition: .2s;
}

input::placeholder {
  color: #777;
}

input:focus {
  border-color: #818cf8;

  box-shadow:
    0 0 0 3px rgba(99,102,241,.15);
}

/* LOGIN BUTTON */

.loginBtn {
  width: 100%;

  margin-top: 20px;

  padding: 14px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(135deg,#6366f1,#4f46e5);

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  transition: .25s;
}

.loginBtn:hover {
  transform: translateY(-2px);

  box-shadow:
    0 10px 30px rgba(79,70,229,.35);
}

/* NOTICE */

.demo {
  text-align: center;

  margin-top: 20px;

  color: #777;

  font-size: 11px;

  line-height: 1.5;
}


/* =========================================
   FAKE HACK SCREEN
========================================= */

#hackScreen {
  display: none;

  position: fixed;

  inset: 0;

  background: #000;

  z-index: 9999;

  overflow: hidden;
}

/* MATRIX CANVAS */

#matrixCanvas {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  opacity: .75;
}

.matrixOverlay {
  position: absolute;

  inset: 0;

  background:
    radial-gradient(
      circle,
      transparent 0%,
      rgba(0,0,0,.45) 65%,
      rgba(0,0,0,.9) 100%
    );
}

/* SCANLINES */

.scanlines {
  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 2px,
      transparent 5px
    );

  opacity: .35;
}

/* TERMINAL */

.terminal {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  width: 850px;

  max-width: 92%;

  max-height: 80vh;

  padding: 25px;

  background: rgba(0,0,0,.78);

  border:
    1px solid rgba(0,255,90,.35);

  border-radius: 14px;

  box-shadow:
    0 0 50px rgba(0,255,80,.12);

  overflow: hidden;
}

.terminalHeader {
  display: flex;

  align-items: center;

  gap: 8px;

  padding-bottom: 15px;

  border-bottom:
    1px solid rgba(0,255,90,.18);

  margin-bottom: 15px;
}

.dot {
  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: #20ff70;

  box-shadow:
    0 0 10px #20ff70;
}

.terminalTitle {
  margin-left: 8px;

  color: #20ff70;

  font-size: 12px;

  letter-spacing: 2px;
}

#terminalText {
  height: 330px;

  overflow: hidden;

  color: #20ff70;

  font-family: "Courier New", monospace;

  font-size: 13px;

  line-height: 1.55;

  text-shadow:
    0 0 7px rgba(0,255,90,.7);
}

.terminalLine {
  white-space: nowrap;
}


/* =========================================
   FAKE ALERT
========================================= */

.fakeAlert {
  display: none;

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  width: 600px;

  max-width: 90%;

  padding: 35px 25px;

  text-align: center;

  background: rgba(0,0,0,.94);

  border: 2px solid #ff2222;

  border-radius: 15px;

  box-shadow:
    0 0 70px rgba(255,0,0,.35);

  animation:
    alertAppear .4s ease;
}

@keyframes alertAppear {
  from {
    opacity: 0;

    transform:
      translate(-50%,-50%)
      scale(.85);
  }

  to {
    opacity: 1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

.alertIcon {
  font-size: 70px;

  margin-bottom: 10px;

  animation:
    alertPulse .55s infinite alternate;
}

@keyframes alertPulse {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.12);
  }
}

.alertTitle {
  color: #ff2222;

  font-size: 35px;

  font-weight: 900;

  letter-spacing: 2px;

  text-shadow:
    0 0 15px rgba(255,0,0,.8);
}

.alertSub {
  margin-top: 12px;

  color: #ddd;

  font-family:
    "Courier New", monospace;

  font-size: 14px;
}

/* PRANK REVEAL */

.prankReveal {

  margin-top: 20px;

  color: #20ff70;

  font-size: 14px;

  line-height: 1.7;

.returnBtn {

  padding: 11px 24px;

  border: none;

  border-radius: 9px;

  background: white;

  color: black;

  font-weight: bold;

  cursor: pointer;
}

.returnBtn:hover {
  transform: scale(1.04);
}

html[data-theme="dark"]{color-scheme:dark}

body{

  transition:background .7s ease,color .7s ease;
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;z-index:-1;pointer-events:none;
  width:42vw;height:42vw;border-radius:50%;filter:blur(75px);opacity:.34;
  animation:liquidFloat 15s ease-in-out infinite alternate;
}
body:before{left:-16vw;top:8vh;background:#007aff}
body:after{right:-16vw;bottom:-10vh;background:#af52de;animation-delay:-7s}
@keyframes liquidFloat{to{transform:translate(5%,8%) scale(1.12)}}

/* Main glass card */
.container{
  position:relative!important;
  background:linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,255,255,.13))!important;
  border:1px solid var(--line)!important;
  border-radius:36px!important;
  box-shadow:var(--shadow)!important;
  -webkit-backdrop-filter:blur(36px) saturate(185%);
  backdrop-filter:blur(36px) saturate(185%);
  overflow:hidden;
}
.container:before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
   linear-gradient(125deg,rgba(255,255,255,.38),transparent 30%,transparent 70%,rgba(255,255,255,.09));
}
.container:after{
  content:"";position:absolute;top:-100%;left:-35%;width:35%;height:280%;
  pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:rotate(18deg);animation:glassSheen 9s ease-in-out infinite;
}
@keyframes glassSheen{
  0%,55%{transform:translateX(-150%) rotate(18deg);opacity:0}
  65%{opacity:.5}
  88%,100%{transform:translateX(480%) rotate(18deg);opacity:0}
}

.logo,.subtitle,.tabs,.form,.demo{position:relative;z-index:2}
.logo{
  background:linear-gradient(135deg,var(--text),var(--accent),var(--accent2))!important;
  -webkit-background-clip:text!important;
  -webkit-text-fill-color:transparent!important;
}
.subtitle{color:var(--muted)!important}

/* Segmented control */
.tabs{
  background:rgba(127,140,160,.13)!important;
  border:1px solid var(--line)!important;

  padding:5px!important;

}
.tabs button{

}
.tabs button:hover{color:var(--text)!important}
.tabs button.active{
  background:var(--glass-strong)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  box-shadow:0 8px 25px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.65)!important;
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
}

/* Provider buttons */
.provider{
  background:rgba(255,255,255,.15)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  box-shadow:0 10px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.5)!important;
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
}
.provider:hover{
  background:rgba(255,255,255,.28)!important;
  transform:translateY(-3px)!important;
  box-shadow:0 18px 40px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.65)!important;
}

/* Inputs */
label{color:var(--muted)!important}
input{
  background:rgba(255,255,255,.13)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  border-radius:17px!important;
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)!important;
}
input::placeholder{color:var(--muted)!important;opacity:.7}
input:focus{
  border-color:rgba(0,122,255,.65)!important;
  box-shadow:0 0 0 4px rgba(0,122,255,.12),inset 0 1px 0 rgba(255,255,255,.65)!important;
}

/* Login button */
.loginBtn{
  background:linear-gradient(135deg,#007aff,#5856d6,#af52de)!important;
  border:1px solid rgba(255,255,255,.35)!important;
  border-radius:18px!important;
  box-shadow:0 16px 40px rgba(0,122,255,.25),inset 0 1px 0 rgba(255,255,255,.5)!important;
}
.loginBtn:hover{transform:translateY(-3px)!important}

.demo{color:var(--muted)!important}

/* Theme button */
.liquid-theme{
  position:fixed;top:22px;right:22px;z-index:10000;
  display:flex;align-items:center;gap:8px;
  min-width:108px;height:46px;padding:0 15px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--glass-strong);color:var(--text);
  box-shadow:0 18px 50px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  cursor:pointer;font-weight:700;transition:.45s ease;
}
.liquid-theme:hover{transform:translateY(-3px) scale(1.03)}
.liquid-theme span:last-child{font-size:13px}

/* Keep the hacker/prank screen intact, but glassify terminal */
#hackScreen{background:#000!important}
.terminal{
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
}

/* Mobile */
@media(max-width:600px){
  .container{border-radius:28px!important}
  .liquid-theme{
    top:12px;right:12px;min-width:46px;width:46px;height:46px;padding:0;justify-content:center;
  }
  .liquid-theme span:last-child{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>
</head>

<script>

/* =========================================
   TAB SWITCH
========================================= */

function showTab(tab, button) {

  document
    .querySelectorAll(".form")
    .forEach(function(form) {

      form.classList.remove("show");

    });


  document
    .getElementById(tab)
    .classList.add("show");


  document
    .querySelectorAll(".tabs button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  button.classList.add("active");
}


/* =========================================
   PROVIDER
========================================= */

let selectedProvider = "";


function chooseProvider(provider) {

  selectedProvider = provider;


  document
    .getElementById("signin")
    .classList.remove("show");


  document
    .getElementById("login")
    .classList.add("show");


  document
    .querySelectorAll(".tabs button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  document
    .querySelector(
      ".tabs button:nth-child(2)"
    )
    .classList.add("active");

}


/* =========================================
   FAKE LOGIN
========================================= */

let sirenAudioContext = null;
let sirenAudioBuffer = null;
let sirenSource = null;
let sirenGain = null;
let sirenStopTimer = null;

/* =========================================
   MATRIX EFFECT
========================================= */

function startMatrix() {

  const canvas =
    document.getElementById(
      "matrixCanvas"
    );

  const ctx =
    canvas.getContext("2d");


  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;


  const characters =
    "01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";


  const fontSize = 15;


  const columns =
    Math.floor(
      canvas.width / fontSize
    );


  const drops =
    new Array(columns).fill(1);


  function drawMatrix() {

    ctx.fillStyle =
      "rgba(0,0,0,0.08)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#20ff70";


    ctx.font =
      fontSize + "px monospace";


    for (
      let i = 0;
      i < drops.length;
      i++

function fakeLogin() {
  // Unlock Web Audio directly inside the login tap (important on iPhone/Android).
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass && !sirenAudioContext) {
      sirenAudioContext = new AudioContextClass();
    }
    if (sirenAudioContext && sirenAudioContext.state !== "running") {
      sirenAudioContext.resume().catch(function(error) {
        console.warn("Audio context resume was blocked.", error);
      });
    }
    if (sirenAudioContext) {
      decodeUploadedSiren().catch(function(error) {
        console.warn("Could not decode the uploaded siren audio.", error);
      });
    }
  } catch (error) {
    console.warn("Audio is unavailable in this browser.", error);
  }

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter information.");
    return;
  }

  document.getElementById("hackScreen").style.display = "block";
  startMatrix();
  startTerminal();
}

function playSirenFromTap() {
  const button = document.getElementById("playSirenButton");
  if (!sirenAudioContext) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) sirenAudioContext = new AudioContextClass();
  }
  if (!sirenAudioContext) return;

  sirenAudioContext.resume().then(function() {
    return decodeUploadedSiren();
  }).then(function(buffer) {
    playDecodedSiren(buffer);
    if (button) button.style.display = "none";
  }).catch(function(error) {
    console.warn("Could not play the uploaded siren.", error);
    if (button) button.textContent = "Sound could not be played in this browser";
  });
}

function playDecodedSiren(buffer) {
  if (!sirenAudioContext || !buffer) return;
  stopSiren();

  sirenSource = sirenAudioContext.createBufferSource();
  sirenGain = sirenAudioContext.createGain();
  sirenSource.buffer = buffer;
  sirenGain.gain.setValueAtTime(0.45, sirenAudioContext.currentTime);
  sirenSource.connect(sirenGain);
  sirenGain.connect(sirenAudioContext.destination);
  sirenSource.onended = function() {
    sirenSource = null;
    sirenGain = null;
  };
  sirenSource.start();
  sirenStopTimer = window.setTimeout(stopSiren, buffer.duration * 1000 + 150);
}

function startSiren() {
  const button = document.getElementById("playSirenButton");
  if (!sirenAudioContext) {
    if (button) button.style.display = "inline-block";
    return;
  }

  // Resume again at warning time; some mobile browsers suspend audio after delays.
  sirenAudioContext.resume().then(function() {
    return decodeUploadedSiren();
  }).then(function(buffer) {
    playDecodedSiren(buffer);
  }).catch(function(error) {
    console.warn("Automatic siren playback was blocked.", error);
    // Mobile Safari/Chrome may require a fresh tap after the animation delay.
    if (button) button.style.display = "inline-block";
  });
}

function stopSiren() {
  if (sirenStopTimer) {
    clearTimeout(sirenStopTimer);
    sirenStopTimer = null;
  }
  if (sirenGain && sirenAudioContext) {
    try {
      sirenGain.gain.cancelScheduledValues(sirenAudioContext.currentTime);
      sirenGain.gain.setTargetAtTime(0, sirenAudioContext.currentTime, 0.04);
    } catch (error) {}
  }
  if (sirenSource) {
    try { sirenSource.stop(); } catch (error) {}
    sirenSource = null;
  }
  sirenGain = null;
}

}

<script>
(() => {
  const root=document.documentElement;
  const btn=document.getElementById('liquidTheme');
  const icon=document.getElementById('liquidThemeIcon');
  const label=document.getElementById('liquidThemeLabel');
  let theme=localStorage.getItem('ik-secure-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

  function applyTheme(t,save=true){
    theme=t;
    root.dataset.theme=t;
    if(save) localStorage.setItem('ik-secure-theme',t);
    icon.textContent=t==='dark'?'🌙':'☀️';
    label.textContent=t==='dark'?'Dark':'Light';
  }
  applyTheme(theme,false);
  btn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
})();
</script>
